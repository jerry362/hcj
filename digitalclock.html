<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 디자인 설정을 불러옵니다 -->
    <link rel="stylesheet" href="./css/dc.css" />
    <title>감성 디지털 시계</title>
  </head>
  <body>
    <!-- 제목 부분 -->
    <h2>Digital Clock</h2>

    <!-- 시계 숫자들이 들어갈 큰 상자 -->
    <div class="clock">
      <!-- '시' 상자 -->
      <div>
        <span id="hour">00</span>
        <span class="text">Hours</span>
      </div>
      <!-- '분' 상자 -->
      <div>
        <span id="minutes">00</span>
        <span class="text">Minutes</span>
      </div>
      <!-- '초' 상자 -->
      <div>
        <span id="seconds">00</span>
        <span class="text">Seconds</span>
      </div>
      <!-- '오전/오후' 상자 -->
      <div>
        <span id="ampm">AM</span>
      </div>
    </div>

    <!-- 시계를 움직이게 할 두뇌를 불러옵니다 -->
    <script src="./js/dc.js"></script>
  </body>
</html>

<!--
id="hour", id="minutes": 자바스크립트라는 '두뇌'가 이 이름을 보고 해당 위치를 찾아가서 숫자를 바꿔줍니다. 
<link>와 <script>: 각각 옷(CSS)과 지능(JS)을 몸체(HTML)에 연결해주는 통로입니다
-->
